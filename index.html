<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investičná kalkulačka</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #172036;
      padding: 24px;
    }
    .calculator {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.7rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    label {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input,
    select {
      width: 100%;
      border: 1px solid #ced8ea;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .result {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .card {
      background: #eff4ff;
      border-radius: 10px;
      padding: 12px;
    }
    .card small {
      display: block;
      color: #4d5b79;
      margin-bottom: 6px;
    }
    .card strong {
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Investičná kalkulačka</h1>
    <div class="grid">
      <div>
        <label for="frequency">Frekvencia vkladu</label>
        <select id="frequency">
          <option value="monthly">Mesačný vklad</option>
          <option value="weekly">Týždenný vklad</option>
        </select>
      </div>
      <div>
        <label for="contribution" id="contributionLabel">Výška mesačného vkladu (€)</label>
        <input id="contribution" type="number" min="0" max="3000" step="10" value="200" />
      </div>
      <div>
        <label for="returnRate">Priemerný ročný výnos (%)</label>
        <input id="returnRate" type="number" min="0" max="20" step="0.1" value="8" />
      </div>
      <div>
        <label for="years">Dĺžka investovania (roky)</label>
        <input id="years" type="number" min="1" max="60" step="1" value="20" />
      </div>
      <div>
        <label for="initial">Počiatočný kapitál (€)</label>
        <input id="initial" type="number" min="0" max="1000000" step="100" value="1000" />
      </div>
      <div>
        <label for="inflation">Predpokladaná inflácia (%)</label>
        <input id="inflation" type="number" min="0" max="15" step="0.1" value="2" />
      </div>
    </div>

    <section class="result" aria-live="polite">
      <div class="card">
        <small>Odhadovaná konečná hodnota</small>
        <strong id="finalValue">0 €</strong>
      </div>
      <div class="card">
        <small>Celkové vklady (vrátane počiatočného kapitálu)</small>
        <strong id="totalContributions">0 €</strong>
      </div>
      <div class="card">
        <small>Výnos nad vklady</small>
        <strong id="profit">0 €</strong>
      </div>
      <div class="card">
        <small>Kúpna sila v dnešných eurách</small>
        <strong id="todayValue">0 €</strong>
      </div>
    </section>
  </main>

  <script>
    const frequencyInput = document.getElementById('frequency');
    const contributionInput = document.getElementById('contribution');
    const contributionLabel = document.getElementById('contributionLabel');
    const returnRateInput = document.getElementById('returnRate');
    const yearsInput = document.getElementById('years');
    const initialInput = document.getElementById('initial');
    const inflationInput = document.getElementById('inflation');

    const finalValueOutput = document.getElementById('finalValue');
    const totalContributionsOutput = document.getElementById('totalContributions');
    const profitOutput = document.getElementById('profit');
    const todayValueOutput = document.getElementById('todayValue');

    const currencyFormatter = new Intl.NumberFormat('sk-SK', {
      style: 'currency',
      currency: 'EUR',
      maximumFractionDigits: 2,
    });

    function clamp(value, min, max) {
      if (!Number.isFinite(value)) return min;
      return Math.min(Math.max(value, min), max);
    }

    function updateContributionLabel() {
      const isWeekly = frequencyInput.value === 'weekly';
      contributionLabel.textContent = isWeekly
        ? 'Výška týždenného vkladu (€)'
        : 'Výška mesačného vkladu (€)';
    }

    function calculate() {
      updateContributionLabel();

      const frequency = frequencyInput.value;
      const periodsPerYear = frequency === 'weekly' ? 52 : 12;

      const contribution = clamp(Number(contributionInput.value), 0, 3000);
      const annualReturnRate = clamp(Number(returnRateInput.value), 0, 20) / 100;
      const years = clamp(Number(yearsInput.value), 1, 60);
      const initial = clamp(Number(initialInput.value), 0, 1000000);
      const inflation = clamp(Number(inflationInput.value), 0, 15) / 100;

      const periodRate = Math.pow(1 + annualReturnRate, 1 / periodsPerYear) - 1;
      const periods = Math.round(years * periodsPerYear);

      let value = initial;
      for (let i = 0; i < periods; i += 1) {
        value *= (1 + periodRate);
        value += contribution;
      }

      const periodicContributions = contribution * periods;
      const totalContributions = initial + periodicContributions;
      const profit = value - totalContributions;
      const todayValue = value / Math.pow(1 + inflation, years);

      finalValueOutput.textContent = currencyFormatter.format(value);
      totalContributionsOutput.textContent = currencyFormatter.format(totalContributions);
      profitOutput.textContent = currencyFormatter.format(profit);
      todayValueOutput.textContent = currencyFormatter.format(todayValue);
    }

    [
      frequencyInput,
      contributionInput,
      returnRateInput,
      yearsInput,
      initialInput,
      inflationInput,
    ].forEach((field) => {
      field.addEventListener('input', calculate);
      field.addEventListener('change', calculate);
    });

    calculate();
  </script>
</body>
</html>
